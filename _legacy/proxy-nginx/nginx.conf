worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $uri $upstream {
        default http://avance-control-panel:4173;
        ~^/issuer/pid-registraduria(?:/|$) http://haproxy-reg:80;
        ~^/issuer/pid-uis(?:/|$)          http://haproxy-uis:80;
        ~^/pid-issuer(?:/|$)              http://haproxy-pid:80;
        ~^/verifier(?:/|$)                http://avance-verifier-api:8080;
        ~^/spartans(?:/|$)                 http://spartans-wallet-provider:8080;
        ~^/onboarding(?:/|$)               http://onboarding-backend:8095;
        ~^/wallet-provider(?:/|$)           http://newwallet-provider:8080;
        ~^/newwallet-status(?:/|$)          http://status-list-nwp:5000;
        ~^/addi/onboarding(?:/|$)           http://backend:8095;
        ~^/addi/biometrics(?:/|$)           http://biometrics:8100;
    }

    # Los siguientes servicios esperan la ruta desde la raíz de su aplicación.
    map $uri $upstream_path {
        default $uri;
        ~^/verifier(?:/(.*))?$           /$1;
        ~^/spartans(?:/(.*))?$            /$1;
        ~^/onboarding(?:/(.*))?$          /$1;
        ~^/wallet-provider(?:/(.*))?$     /$1;
        ~^/newwallet-status(?:/(.*))?$    /$1;
        ~^/addi/onboarding(?:/(.*))?$     /$1;
        ~^/addi/biometrics(?:/(.*))?$     /$1;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name civica-desarrollo.avance.org.co _;
        ssl_certificate /etc/letsencrypt/live/civica-desarrollo.avance.org.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/civica-desarrollo.avance.org.co/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 20m;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }
        location / {
            if ($upstream = "") {
                return 404;
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass $upstream$upstream_path$is_args$args;
        }
    }
}
