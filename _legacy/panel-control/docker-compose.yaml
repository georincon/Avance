services:
  panel-control:
    build: .
    container_name: avance-control-panel
    restart: unless-stopped
    environment:
      AVANCE_ROOT: /home/geovani/Workspace/Avance
      CONTROL_PANEL_TOKEN: ${CONTROL_PANEL_TOKEN:?Configura CONTROL_PANEL_TOKEN en .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/geovani/Workspace/Avance:/home/geovani/Workspace/Avance:ro
    networks:
      gateway:
        aliases:
          - avance-control-panel
networks:
  gateway:
    name: avance-proxy
    external: true
