# Router interno del notaria-issuer: reparte por prefijo y se lo quita a cada servicio, que
# (como en los repos EUDI) cuelga de la raíz. El proxy único (nw-nginx) enruta aquí
# /notaria-issuer y los /.well-known/*/notaria-issuer; este haproxy no publica puertos.
global
    maxconn 5000
    log stdout format raw local0
defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout client 60s
    timeout server 60s
resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend all
    bind 0.0.0.0:80
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Proto https

    # 1) Decidir el destino ANTES de reescribir el path: las ACL se evalúan al usarse y, tras quitar el
    #    prefijo, ya no coincidirían.
    # Rutas de depuracion y de administracion del backend (devuelven lineas de log con datos de formularios y el estado de
    # sesiones): no se publican hacia afuera. Los servicios internos las alcanzan directo, sin pasar por este proxy.
    http-request deny deny_status 404 if { path_beg -i /notaria-issuer/api/logs }
    http-request deny deny_status 404 if { path_beg -i /notaria-issuer/api/admin }
    http-request deny deny_status 404 if { path_beg -i /notaria-issuer/oidc/logs }
    http-request deny deny_status 404 if { path_beg -i /notaria-issuer/oidc/admin }

    http-request set-var(txn.destino) str(oidc)     if { path_beg /notaria-issuer/oidc }
    http-request set-var(txn.destino) str(oidc)     if { path_beg /.well-known/oauth-authorization-server/notaria-issuer/oidc }
    http-request set-var(txn.destino) str(oidc)     if { path_beg /.well-known/openid-configuration/notaria-issuer/oidc }
    http-request set-var(txn.destino) str(api)      if { path_beg /notaria-issuer/api }
    http-request set-var(txn.destino) str(frontend) if !{ var(txn.destino) -m found }

    # 2) El prefijo que cada servicio debe usar para construir sus URL.
    http-request set-header X-Forwarded-Prefix /notaria-issuer/oidc if { var(txn.destino) -m str oidc }
    http-request set-header X-Forwarded-Prefix /notaria-issuer/api  if { var(txn.destino) -m str api }
    http-request set-header X-Forwarded-Prefix /notaria-issuer      if { var(txn.destino) -m str frontend }

    # 3) Quitar el prefijo. La metadata well-known (RFC 8414 / OID4VCI) lleva la ruta del emisor como sufijo.
    http-request set-path /.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/notaria-issuer/oidc }
    http-request set-path /.well-known/openid-configuration       if { path_beg /.well-known/openid-configuration/notaria-issuer/oidc }
    http-request set-path %[path,regsub(^/notaria-issuer/oidc,)]  if { path_beg /notaria-issuer/oidc }
    http-request set-path %[path,regsub(^/notaria-issuer/api,)]   if { path_beg /notaria-issuer/api }
    http-request set-path %[path,regsub(/notaria-issuer$,)]       if { path_beg /.well-known/ } { path_end /notaria-issuer }
    http-request set-path %[path,regsub(^/notaria-issuer,)]       if { path_beg /notaria-issuer }

    use_backend oidc if { var(txn.destino) -m str oidc }
    use_backend api  if { var(txn.destino) -m str api }
    default_backend frontend

backend oidc
    server s notaria-issuer-oidc:5000 resolvers docker init-addr libc,none
backend api
    server s notaria-issuer-backend:5000 resolvers docker init-addr libc,none
backend frontend
    server s notaria-issuer-frontend:5000 resolvers docker init-addr libc,none
