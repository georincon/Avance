worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Un solo punto de entrada para TODO el ecosistema EUDI de Avance.
    # Cada servicio se publica bajo un prefijo de ruta; el que no coincide cae en el panel de control.
    #
    # El proxy publico (190.29.100.206) termina el TLS y reenvia a este PC por el
    # puerto 80, asi que aqui $scheme siempre es "http". Si se propagara tal cual,
    # Keycloak construiria los endpoints de su metadata (token_endpoint,
    # pushed_authorization_request_endpoint) con "http://" y el DPoP se validaria
    # contra una URL distinta de la que el cliente uso de verdad. Se propaga el
    # esquema original del cliente cuando viene en X-Forwarded-Proto.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # La URL publica del emisor de la Registraduria es https. El borde (proxy
    # publico) termina el TLS y reenvia por http a este nginx, asi que aqui
    # $scheme es http y el emisor calcularia el htu del DPoP con http, mientras
    # que el cliente manda el de su URL publica (https): el credentialEndpoint
    # respondia 401 "Invalid DPoP proof: JWT htu claim value rejected". Al emisor
    # se le anuncia https; al resto de servicios, el esquema real del cliente.
    map $uri $service_forwarded_proto {
        default                            $forwarded_proto;
        ~^/pid-registraduria(?:/|$)       "https";
        ~^/uis-issuer(?:/|$)               "https";
    }

    map $uri $upstream {
        default                            http://avance-control-panel:4173;
        # Wallet Provider: emision de attestations bajo el prefijo y metadata RFC 9728 en la raiz.
        ~^/wallet-provider(?:/|$)          http://spartans-wallet-provider:8080;
        ~^/\.well-known/oauth-protected-resource$  http://spartans-wallet-provider:8080;
        ~^/jwks$                           http://spartans-wallet-provider:8080;
        ~^/onboarding(?:/|$)               http://onboarding-backend:8095;
        ~^/biometrics(?:/|$)               http://onboarding-biometrics:8100;
        # Issuer de la Registraduria: su haproxy reescribe las rutas well-known de OpenID4VCI.
        ~^/pid-registraduria(?:/|$)        http://haproxy-reg:80;
        # Keycloak de la Registraduria. Prefijo PROPIO: `/idp-uis` es el de la UIS.
        ~^/idp-reg(?:/|$)                 http://haproxy-reg:80;
        # Issuer UIS (PuB-EAA). SUS REGLAS TIENEN QUE IR ANTES de las genericas de
        # `/.well-known/...` de la Registraduria: en un map de nginx gana la primera
        # expresion regular que coincide, y la generica se llevaria por delante
        # `/.well-known/openid-credential-issuer/uis-issuer`.
        # Aerolinea simulada (emisor QEAA del tiquete + portal de venta y embarque), igual que la EPS.
        ~^/aerolinea(?:/|$)               http://app-aerolinea:80;
        ~^/\.well-known/(?:openid-credential-issuer|oauth-authorization-server)/aerolinea(?:/|$) http://app-aerolinea:80;
        # EPS simulada (emisor QEAA + portales). Antes de las genericas de well-known por lo mismo.
        # Notaria simulada (emisor PuB-EAA + portal), igual que la EPS.
        ~^/notaria(?:/|$)                 http://app-notaria:80;
        ~^/cancilleria(?:/|$)             http://app-cancilleria:80;
        ~^/\.well-known/(?:openid-credential-issuer|oauth-authorization-server)/cancilleria(?:/|$) http://app-cancilleria:80;
        ~^/\.well-known/(?:openid-credential-issuer|oauth-authorization-server)/notaria(?:/|$) http://app-notaria:80;
        # Simulador del prestador de firma remota (API CSC v2, OAuth2 y sellado de tiempo). Su metadata
        # RFC 8414 va por la ruta de especificacion, antes de las genericas de well-known.
        ~^/andes-scd(?:/|$)               http://app-andes-scd:80;
        ~^/\.well-known/oauth-authorization-server/andes-scd(?:/|$) http://app-andes-scd:80;
        ~^/eps(?:/|$)                     http://app-eps:80;
        ~^/\.well-known/(?:openid-credential-issuer|oauth-authorization-server)/eps(?:/|$) http://app-eps:80;
        ~^/uis-issuer(?:/|$)              http://haproxy-uis:80;
        ~^/idp-uis(?:/|$)                 http://haproxy-uis:80;
        ~^/\.well-known/(?:openid-credential-issuer|oauth-protected-resource|jwt-vc-issuer|jwt-issuer)/uis-issuer(?:/|$) http://haproxy-uis:80;
        ~^/\.well-known/(?:oauth-authorization-server|openid-configuration)/idp-uis(?:/|$) http://haproxy-uis:80;
        ~^/\.well-known/(?:openid-credential-issuer|oauth-protected-resource|jwt-vc-issuer|jwt-issuer|oauth-authorization-server|openid-configuration)(?:/|$) http://haproxy-reg:80;
        # Verificador / Relying Party generico. Sirve en la raiz de su aplicacion:
        # el proxy le quita el prefijo.
        ~^/verifier(?:/|$)                http://avance-verifier-api:8080;
        # Instancias de verifier (verifiers/_comun): /verifier-<nombre> llega al gateway haproxy de
        # esa instancia, cuyo alias en avance-eudi es verifier-<nombre>. NO se quita el prefijo (a
        # diferencia de /verifier): el haproxy lo quita el mismo y lo necesita para enrutar.
        ~^/verifier-(?<instancia>[a-z0-9]+(?:-[a-z0-9]+)*)(?:/|$)  http://verifier-$instancia:80;
        # Aplicaciones de ejemplo que usan un verifier (verifiers/<app>). Cada una se une a avance-eudi
        # con el alias app-<nombre> y NO pierde el prefijo: sirve bajo /<nombre>.
        ~^/discoteca(?:/|$)               http://app-discoteca:80;
        ~^/banco(?:/|$)                   http://app-banco:80;
        ~^/contratacion(?:/|$)            http://app-contratacion:80;
        ~^/beca(?:/|$)                    http://app-beca:80;
        ~^/acceso(?:/|$)                  http://app-acceso:80;
        ~^/pensiones(?:/|$)               http://app-pensiones:80;
        # Listas de estado (una por issuer)
        ~^/status-list/wallet-provider(?:/|$)    http://status-list-spartans:5000;
        ~^/status-list/pid-registraduria(?:/|$) http://status-list-reg:5000;
        ~^/status-list/uis-issuer(?:/|$)         http://status-list-uis:5000;
        # Publicador local de Trusted Lists (srv-tl-publisher).
        #
        # Se publica por dos prefijos a proposito. `/tl-publisher` es el que
        # usan los consumidores (la app, el verifier) y sustituye al del
        # despliegue publico. Las rutas en la raiz (`/TL`, `/LOTL`, `/tl-api`)
        # son las que el propio publicador escribe DENTRO de las listas
        # firmadas: la URL de cada lista y la de la LOTL salen de ahi, asi que
        # tienen que resolverse en la raiz del dominio.
        ~^/tl-publisher(?:/|$)          http://tl-publisher:8080;
        ~^/TL(?:/|$)                    http://tl-publisher:8080;
        ~^/LOTL(?:/|$)                  http://tl-publisher:8080;
        ~^/tl-api(?:/|$)                http://tl-publisher:8080;
        # Reglas de comunidad y tipos de servicio que declara cada lista.
        ~^/trust/schemerules(?:/|$)     http://tl-publisher:8080;
        ~^/trust/Svctype(?:/|$)         http://tl-publisher:8080;
        # Lo que prometen los certificados en sus extensiones AIA y CRLDP.
        # El servicio los expone en /ca/... y /crl/...; en el dominio publico
        # viven bajo /pki/, que es lo que declaran los certificados.
        ~^/pki/                         http://tl-publisher-pki:8080;
        # Trust Validator (eudi-srv-trust-validator).
        ~^/trust-validator(?:/|$)       http://trust-validator:8080;
        # Su API y su UI: la app usa rutas ABSOLUTAS (/validate, /public/**,
        # /webjars/**), asi que el prefijo no las puede cubrir.
        ~^/trust$                       http://trust-validator:8080;
        ~^/validate(?:/|$)              http://trust-validator:8080;
        ~^/public(?:/|$)                http://trust-validator:8080;
        ~^/webjars(?:/|$)               http://trust-validator:8080;
        ~^/swagger-ui(?:/|$)            http://trust-validator:8080;
    }

    # Los servicios que atienden desde la raiz de su aplicacion necesitan quitar el prefijo.
    # Los que sirven bajo su propio prefijo (haproxy, status-list) lo conservan intacto.
    map $uri $upstream_path {
        default $uri;
        ~^/wallet-provider(?:/(.*))?$        /$1;
        ~^/onboarding(?:/(.*))?$             /$1;
        ~^/biometrics(?:/(.*))?$             /$1;
        ~^/status-list/wallet-provider(?:/(.*))?$     /$1;
        ~^/status-list/pid-registraduria(?:/(.*))?$  /$1;
        ~^/status-list/uis-issuer(?:/(.*))?$         /$1;
        # El verifier sirve en la raiz de su aplicacion (no tiene base-path):
        # sus enlaces se construyen con URI(publicUrl).path, asi que el
        # prefijo /verifier tiene que desaparecer.
        ~^/verifier(?:/(.*))?$                      /$1;
        # El publicador de listas vive en la raiz de su aplicacion: sus rutas
        # (/TL/..., /LOTL/current.xml, /tl-api/...) no llevan prefijo.
        ~^/tl-publisher(?:/(.*))?$           /$1;
        # El validador de confianza tambien, y su UI usa rutas absolutas.
        ~^/trust-validator(?:/(.*))?$        /$1;
        # El servicio de la PKI expone /ca y /crl; en el dominio van bajo /pki.
        ~^/pki/(.*)$                       /$1;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name civica-desarrollo.avance.org.co _;

        # El proxy publico (190.29.100.206) reenvia el TLS a este puerto. El certificado de
        # produccion (*.avance.org.co) lo termina el proxy publico; aqui se acepta el
        # handshake con el certificado local de desarrollo (proxy_ssl_verify off en el borde).
        ssl_certificate     /etc/letsencrypt/live/civica-desarrollo.avance.org.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/civica-desarrollo.avance.org.co/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 20m;

        # Desafio de ACME (certbot). El proxy publico enruta /.well-known/acme-challenge/ al puerto 80.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            if ($upstream = "") {
                return 404;
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $service_forwarded_proto;
            # Cabecera "Forwarded" (RFC 7239). Spring con la estrategia
            # "framework" la usa para reconstruir la URI de la peticion, que es
            # contra lo que el emisor valida el htu del DPoP. Con solo
            # X-Forwarded-Proto el emisor calculaba http:// y rechazaba la
            # peticion con "JWT htu claim value rejected".
            proxy_set_header Forwarded "proto=$service_forwarded_proto;host=$host";
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass $upstream$upstream_path$is_args$args;
        }
    }
}
