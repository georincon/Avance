# La universidad de ejemplo. Cuelga directamente de la red compartida "avance-eudi" con el
# alias app-PREFIJO: el nginx central le pasa con la ruta completa tanto
# https://DOMINIO/PREFIJO/… como https://DOMINIO/.well-known/<x>/PREFIJO (la
# metadata del emisor). Habla con su verifier (../_comun, instancia
# VERIFIER_INSTANCIA) por la misma red.
#
# Se usa con ./levantar.sh o, ya creada: docker compose -p universidad --env-file .env logs -f
name: universidad

services:
  universidad:
    build: .
    restart: unless-stopped
    # El dueño de ./datos y ./secretos (quien ejecutó levantar.sh).
    user: ${UID_GID:-1000:1000}
    environment:
      URL_PUBLICA: https://${DOMINIO}/${PREFIJO}
      VERIFIER_API: http://verifier-${VERIFIER_INSTANCIA}/verifier-${VERIFIER_INSTANCIA}
      TRUST_VALIDATOR_URL: ${TRUST_VALIDATOR_URL}
      UNIVERSIDAD_NOMBRE: ${UNIVERSIDAD_NOMBRE}
      FUNCIONARIO_NOMBRE: ${FUNCIONARIO_NOMBRE}
      SECRETOS_DIR: /secretos
      TRAMITES_ARCHIVO: /datos/tramites.json
      ACADEMICO_URL: ${ACADEMICO_URL}
      UIS_HANDOFF_SECRET: ${UIS_HANDOFF_SECRET}
      UIS_ISSUER_PUBLIC: ${UIS_ISSUER_PUBLIC}
      PUERTO: "80"
    volumes:
      - ./datos:/datos
      - ./secretos:/secretos:ro
    networks:
      avance-eudi:
        aliases: ["app-${PREFIJO}"]
      academico: {}

networks:
  avance-eudi:
    name: avance-eudi
    external: true
  # La red de la base académica de la UIS (stack eudi-srv-issuer-pid-uis).
  academico:
    name: uis-issuer_default
    external: true
