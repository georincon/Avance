# Gateway de una instancia del verifier. El proxy único (srv-nw-nginx) le pasa todo lo que
# empieza por /PREFIJO (alias de este contenedor en la red avance-eudi) con la ruta
# completa. El endpoint y la UI sirven en la raíz: aquí se quita el prefijo.
#
#   /PREFIJO/ui/…  /PREFIJO/wallet/…  /PREFIJO/utilities/…   → verifier-api:8080
#   el resto de /PREFIJO/…                                   → verifier-web:4300 (UI)

global
    log stdout format raw local0

defaults
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    log global
    mode http
    option httplog
    default_backend no-match

frontend gateway
    bind 0.0.0.0:80
    # Sin barra final la UI no resolvería sus rutas relativas (base href).
    http-request redirect location "/${PREFIJO}/" code 301 if { path "/${PREFIJO}" }
    use_backend api if { path_beg "/${PREFIJO}/ui/" } || { path_beg "/${PREFIJO}/wallet/" } || { path_beg "/${PREFIJO}/utilities/" }
    use_backend web if { path_beg "/${PREFIJO}/" }

backend api
    http-request replace-path "^/${PREFIJO}"'(/.*)$' "\1"
    server s1 verifier-api:8080

backend web
    http-request replace-path "^/${PREFIJO}"'(/.*)$' "\1"
    server s1 verifier-web:4300

backend no-match
    http-request deny deny_status 404
