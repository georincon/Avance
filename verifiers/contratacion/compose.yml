# Portal del empleador (verificación académica). Se une a la red compartida "avance-eudi" con el alias
# app-contratacion (srv-nw-nginx le pasa /contratacion/… con la ruta completa) y habla con su verifier
# (../_comun, instancia VERIFIER_INSTANCIA) por la misma red, usando el alias de su haproxy.
# Sin volúmenes: no guarda nada.
#
#   ./levantar.sh, o ya creado: docker compose -p contratacion --env-file .env logs -f
name: contratacion

services:
  contratacion:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      URL_PUBLICA: https://${DOMINIO}/${PREFIJO}
      VERIFIER_API: http://verifier-${VERIFIER_INSTANCIA}/verifier-${VERIFIER_INSTANCIA}
      NOMBRE_EMPLEADOR: ${NOMBRE_EMPLEADOR}
      PUERTO: "80"
    networks:
      avance-eudi:
        aliases: ["app-${PREFIJO}"]

networks:
  avance-eudi:
    name: avance-eudi
    external: true
