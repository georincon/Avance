logging.level.org.springframework=info

spring.main.web-application-type=reactive
spring.webflux.static-path-pattern=/public/**
spring.webflux.webjars-path-pattern=/webjars/**
spring.messages.basename=i18n/messages
server.forward-headers-strategy=framework
# Subido de 1MB: la foto de referencia del panel admin de la Tránsito
# (ver README.md) se lee en memoria vía multipart/form-data.
spring.http.codecs.max-in-memory-size=6MB

#
# Issuer options
#
issuer.credentialRequestEncryption.supported=true
issuer.credentialRequestEncryption.required=true
issuer.credentialRequestEncryption.jwks.algorithm=ECDH-ES
issuer.credentialRequestEncryption.encryptionMethods=A128GCM,A256GCM
issuer.credentialRequestEncryption.zipAlgorithmsSupported=
issuer.credentialResponseEncryption.supported=true
issuer.credentialResponseEncryption.required=true
issuer.credentialResponseEncryption.algorithmsSupported=ECDH-ES
issuer.credentialResponseEncryption.encryptionMethods=A128GCM,A256GCM
issuer.credentialResponseEncryption.zipAlgorithmsSupported=

# El Tránsito emite SOLO la licencia de conducción móvil (mDL, ISO 18013-5); el PID lo emite la Registraduría.
issuer.pid.mso_mdoc.enabled=false
issuer.pid.mso_mdoc.encoder.duration=P31D
issuer.pid.mso_mdoc.notifications.enabled=true
issuer.pid.mso_mdoc.proofs.supportedSigningAlgorithms=ES256

issuer.pid.sd_jwt_vc.enabled=false
issuer.pid.sd_jwt_vc.duration=P31D
issuer.pid.sd_jwt_vc.notUseBefore=PT20S
issuer.pid.sd_jwt_vc.notifications.enabled=true
issuer.pid.sd_jwt_vc.digests.hashAlgorithm=sha-256
issuer.pid.sd_jwt_vc.proofs.supportedSigningAlgorithms=ES256

#
# Tránsito (ver README.md): la fuente del mDL es la tabla `licencias`. Al guardar una licencia desde el panel se
# sincroniza el usuario "fantasma" (cédula, sin contraseña) en Keycloak para que el ciudadano pueda pedirla.
#
issuer.transito.syncKeycloak=true
# ISO 3166-2 del departamento del organismo emisor (Santander). Opcional.
issuer.mdl.issuingJurisdiction=CO-SAN
# issuer.transito.admin.username=
# issuer.transito.admin.password=

# Pantalla ciudadana /transito/solicitar (cédula -> QR, sin autenticación). Por defecto encendida;
# ponerla en false en cualquier entorno expuesto: la ruta deja de existir (404).
issuer.transito.solicitar.enabled=true

# Límite de intentos por IP en los endpoints públicos (en memoria, por instancia; cuenta cada intento).
# DESACTIVADO por defecto (0): delante de nginx hay un proxy público y, si no conserva la IP del cliente,
# todos los usuarios externos compartirían la misma IP y se limitarían entre sí. Para activarlo, comprobar
# primero qué IP llega en X-Real-IP (docker logs nw-nginx) con una petición desde datos móviles.
# La IP se toma de la cabecera indicada: debe ser una que el proxy delantero sobrescriba siempre.
# X-Forwarded-For NO sirve: nginx añade su valor al que envíe el cliente.
issuer.rateLimit.clientIpHeader=X-Real-IP
issuer.rateLimit.solicitar.window=PT15M
issuer.rateLimit.solicitar.maxAttemptsPerIp=0
issuer.rateLimit.onboardingOffers.window=PT15M
issuer.rateLimit.onboardingOffers.maxAttemptsPerIp=0

# Login del panel de administración: intentos fallidos por usuario (no depende de la IP). 0 lo desactiva.
issuer.rateLimit.adminLogin.window=PT15M
issuer.rateLimit.adminLogin.maxFailuresPerUser=5

# Revocación por titular (POST /internal/v1/credentials/revoke, cabecera X-Api-Key). Sin clave, la API responde 503.
# issuer.revocation.api-key=

# Aviso al titular cuando se le revoca una credencial (CIR 2024/2977 art. 5(3): dentro de las 24 horas, con el motivo).
# Siempre se registra el aviso con su plazo y el panel/API lo muestra como pendiente. Para entregarlo automáticamente
# hace falta un servicio propio (correo, SMS...) que reciba un POST JSON: issuer.revocation.notification.webhook-url.
# La Tránsito no guarda datos de contacto: sus avisos quedan pendientes para hacerse a mano y marcarse como hechos.
# issuer.revocation.notification.webhook-url=
# issuer.revocation.notification.api-key=
# issuer.revocation.notification.issuer-name=la Dirección de Tránsito de Bucaramanga

issuer.pid.issuingCountry=GR
issuer.pid.issuingJurisdiction=GR-I

issuer.mdl.enabled=true
issuer.mdl.mso_mdoc.encoder.duration=P31D
issuer.mdl.notifications.enabled=true
issuer.mdl.proofs.supportedSigningAlgorithms=ES256

issuer.learningCredential.enabled=false
issuer.learningCredential.sdJwtVc.encoder.digests.hashAlgorithm=sha-256
issuer.learningCredential.validity=P31D
issuer.learningCredential.notifications.enabled=true
issuer.learningCredential.proofs.supportedSigningAlgorithms=ES256

issuer.credentialOffer.defaultUri=eu-eaa-offer://
issuer.credentialOffer.allowedSchemes=https,eu-eaa-offer

issuer.sd-jwt-vc.type-metadata[0].vct=urn:eudi:pid:1
issuer.sd-jwt-vc.type-metadata[0].resource=classpath:/vct/pid_v1.4.json
issuer.sd-jwt-vc.type-metadata[1].vct=urn:eu.europa.ec.eudi:learning:credential:1
issuer.sd-jwt-vc.type-metadata[1].resource=classpath:/vct/learning_credential.json

issuer.dpop.nonce.enabled=true
issuer.dpop.nonce.expiration=PT5M

issuer.credentialEndpoint.batchIssuance.enabled=true
issuer.credentialEndpoint.batchIssuance.batchSize=20
issuer.metadata.preferred-client-status-period=P31D
issuer.cnonce.expiration=PT5M
issuer.revocationJob.cron=0 * */8 * * *

#
# Resource Server configuration
#
spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=${issuer.authorizationServer.introspection}

#
# Proxy settings
#
#issuer.http.proxy.url=http://example.com
#issuer.http.proxy.username=test
#issuer.http.proxy.password=test

#
# Persistence
#
spring.sql.init.mode=never