global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend all
    # TLS directo: solo para pruebas locales contra el propio haproxy. El trafico real de los
    # clientes llega por el proxy unico nw-nginx, que ya termina TLS.
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/transito.tls.pem
    # Flujo interno desde el proxy unico (red compartida 'avance-eudi'), sin TLS: el borde
    # (proxy publico) ya termina TLS antes de llegar aqui.
    bind 0.0.0.0:80
    use_backend keycloak-backend if { path_beg /idp-tra }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp-tra/realms/pid-transito-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp-tra/realms/pid-transito-realm }
    use_backend transito-backend if { path_beg /.well-known/openid-credential-issuer/pid-transito }
    use_backend transito-backend if { path_beg /.well-known/oauth-protected-resource/pid-transito }
    use_backend transito-backend if { path_beg /.well-known/jwt-vc-issuer/pid-transito }
    use_backend transito-metadata if { path /.well-known/jwt-issuer/pid-transito }
    # Canje interno de tickets (solo red docker: lo llama Keycloak). Nunca se expone al exterior.
    http-request deny deny_status 404 if { path_beg /pid-transito/internal/ }
    use_backend transito-backend if { path_beg /pid-transito }
    use_backend status-list-backend if { path_beg /token_status_list }

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # Sin "for": haproxy debe RESPETAR el X-Forwarded-Proto que le pasa nginx.
    option forwarded proto host
    http-request set-path /idp-tra/realms/pid-transito-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp-tra/realms/pid-transito-realm }
    http-request set-path /idp-tra/realms/pid-transito-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp-tra/realms/pid-transito-realm }
    # TLS hacia Keycloak: el esquema que ve Keycloak es el de esta conexion, y el
    # DPoP se valida contra el (htu). Con http aqui la WIA viajaba sin cifrar.
    server server1 keycloak-tra:8443 ssl verify none cookie server1 resolvers docker init-addr libc,none

backend transito-metadata
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"https://civica-desarrollo.avance.org.co/pid-transito\",\"jwks_uri\":\"https://civica-desarrollo.avance.org.co/pid-transito/public_keys.jwks\"}"

backend transito-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # SIN "option forwarded": esa opcion borra las cabeceras X-Forwarded-* que
    # llegan del cliente y pone las de haproxy, que es http (nginx le habla en
    # claro). El emisor reconstruye con ellas la URI de la peticion para validar
    # el htu del DPoP, asi que necesita recibir las que dice nginx (https, que
    # es la URL publica del emisor). Se reenvian tal cual.
    http-request set-header X-Forwarded-Proto %[req.hdr(X-Forwarded-Proto)]
    http-request set-header X-Forwarded-Host %[req.hdr(X-Forwarded-Host)]
    # Spring (estrategia "framework") reconstruye la URI de la peticion con la
    # cabecera "Forwarded" (RFC 7239), que es contra la que valida el htu del DPoP.
    http-request set-header Forwarded %[req.hdr(Forwarded)]
    http-request set-path /pid-transito/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/pid-transito }
    http-request set-path /pid-transito/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/pid-transito }
    http-request set-path /pid-transito/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/pid-transito }
    server server1 transito-issuer:8080 cookie server1 resolvers docker init-addr libc,none

backend status-list-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # Sin "for": haproxy debe RESPETAR el X-Forwarded-Proto que le pasa nginx.
    option forwarded proto host
    server server1 status-list-tra:5000 cookie server1 resolvers docker init-addr libc,none

backend no-match
    http-request deny deny_status 404
